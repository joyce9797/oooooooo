<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>《 星辰之路》——情境式性格測驗</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 932px;
            background-color: #000;
            overflow: hidden;
            touch-action: manipulation;
        }

        @media (min-width: 500px) and (min-height: 500px) {
            #game-container {
                border-radius: 20px;
                border: 2px solid #333;
                height: 90vh;
            }
        }

        /* ------------------------------------------
           📱 1. 載入畫面
           ------------------------------------------ */
        #loading-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            font-weight: bold;
            font-size: 22px;
            color: #ffffff;
            background: #0f0f0f;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            gap: 15px;
            z-index: 999999;
        }

        .progress-container {
            width: 70%;
            max-width: 250px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #progress-bar {
            height: 12px;
            background: #62c6ff;
            width: 0%;
            transition: width 0.3s;
        }

        /* ------------------------------------------
           🖼️ 2. 舞台與角色立繪
           ------------------------------------------ */
        #page1 {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
        }

        .背景圖, .背景 {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .背景圖 img, .背景 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes shake {
          0% { transform: scale(1.05) translate(0, 0) rotate(0deg); }
          20% { transform: scale(1.05) translate(-12px, 6px) rotate(-1deg); }
          40% { transform: scale(1.05) translate(12px, -6px) rotate(1deg); }
          60% { transform: scale(1.05) translate(-8px, -3px) rotate(-0.5deg); }
          80% { transform: scale(1.05) translate(8px, 3px) rotate(0.5deg); }
          100% { transform: scale(1) translate(0, 0) rotate(0deg); }
        }

        .is-shaking {
          animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both !important;
        }

        @keyframes heavyImpact {
          0% { transform: scale(1.05) translate(0, 0) rotate(0deg); filter: brightness(1); }
          10% { transform: scale(1.15) translate(-25px, 15px) rotate(-3deg); filter: brightness(2); }
          20% { transform: scale(1.12) translate(25px, -15px) rotate(3deg); filter: brightness(1.5); }
          30% { transform: scale(1.10) translate(-20px, -10px) rotate(-2deg); filter: brightness(1.2); }
          40% { transform: scale(1.08) translate(20px, 10px) rotate(2deg); filter: brightness(1); }
          60% { transform: scale(1.06) translate(-10px, 5px) rotate(-1deg); }
          80% { transform: scale(1.05) translate(5px, -3px) rotate(0.5deg); }
          100% { transform: scale(1) translate(0, 0) rotate(0deg); filter: brightness(1); }
        }

        .bg-impact-shake {
          animation: heavyImpact 0.4s cubic-bezier(.36,.07,.19,.97) both !important;
        }

        .角色圖 {
            z-index: 10;
        }

        .角色圖 img {
            filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
        }

        .全星辰 {
            z-index: 5;
            width: 80%;
            position: absolute;
            right: 20%;
            bottom: 10px;
            display: none;
        }

        .全星辰 img { width: 160%; height: auto; }

        #星辰思考 {
            width: 70%;
            bottom: 70px;
        }

        .全好奇星 {
            position: absolute;
            left: -12%;
            bottom: 180px;
            width: 75%;
        }

        .全好奇星 img { width: 135%; height: auto; }
        
        #路人好奇星張嘴 {
            position: absolute;
            left: 0px;
            bottom: 190px;
            width: 75%;
        }
        #一群好奇星 {
            position: absolute;
            left: 0px;
            bottom: 200px;
            width: 75%;
        }
        .全同情星 {
            position: absolute;
            left: -5%;
            bottom: 190px;
            width: 70%;
        }

        .全同情星 img { width: 120%; height: auto; }

        .modal-pop-in {
          animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
          transform-origin: center center; 
        }

        .slide-in-right { animation: slideInFromRight 0.4s ease-out forwards; }
        @keyframes slideInFromRight {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .scared-bounce { animation: scareJump 0.4s ease-out; }
        @keyframes scareJump {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-25px) scale(0.95, 1.05); }
            60% { transform: translateY(0) scale(1.05, 0.95); }
        }

        .curious-pop { animation: curiousPop 0.35s ease-out both !important; }
        @keyframes curiousPop {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(0.98, 1.05); }
        }

        .curious-bounce { animation: curiousBounce 0.5s ease-out both !important; }
        @keyframes curiousBounce {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-20px); }
            60% { transform: translateY(-8px); }
        }

        .curious-wiggle { animation: curiousWiggle 0.5s ease-in-out both !important; }
        @keyframes curiousWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        .nod-head { animation: headNod 0.4s ease-in-out; }
        @keyframes headNod {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        @keyframes bounce-once {
          0% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
          100% { transform: translateY(0); }
        }

        @keyframes sway-once {
          0% { transform: rotate(0deg); }
          25% { transform: rotate(-2deg); }
          75% { transform: rotate(2deg); }
          100% { transform: rotate(0deg); }
        }

        @keyframes depress-down {
          0% { transform: translateY(0) rotate(0deg); }
          30% { transform: translateY(12px) rotate(-2deg); }
          50% { transform: translateY(15px) rotate(1deg); }
          70% { transform: translateY(13px) rotate(-1deg); }
          100% { transform: translateY(15px) rotate(-2deg); }
        }

        @keyframes cry-once {
          0%, 100% { transform: translate(0, 0); }
          20% { transform: translate(-3px, 1px); }
          40% { transform: translate(3px, -1px); }
          60% { transform: translate(-3px, -1px); }
          80% { transform: translate(3px, 1px); }
        }

        @keyframes talk-once {
          0% { transform: translateY(0); }
          50% { transform: translateY(6px); }
          100% { transform: translateY(0); }
        }

        @keyframes excited-bounce-smooth {
          0%   { transform: translateY(0) scale(1, 1); }
          15%  { transform: translateY(4px) scale(1.08, 0.92); }
          35%  { transform: translateY(-30px) scale(0.92, 1.08); }
          55%  { transform: translateY(0) scale(1.05, 0.95); }
          70%  { transform: translateY(-12px) scale(0.98, 1.02); }
          85%  { transform: translateY(0) scale(1.02, 0.98); }
          100% { transform: translateY(0) scale(1, 1); }
        }

        .anim-excited {
          display: block !important;
          animation: excited-bounce-smooth 0.8s ease-out !important; 
          transform-origin: bottom center;
        }

        .anim-bounce { 
          display: block !important;
          animation: bounce-once 0.8s ease-in-out forwards !important; 
          transform-origin: bottom center;
        }

        .anim-sway { 
          display: block !important;
          animation: sway-once 1s ease-in-out forwards !important; 
          transform-origin: bottom center;
        }

        .anim-depress { 
          display: block !important;
          animation: depress-down 1.2s ease-out forwards !important; 
          transform-origin: bottom center;
        }

        .anim-cry { 
          display: block !important;
          animation: cry-once 0.6s ease-in-out forwards !important; 
          transform-origin: center center;
        }

        /* ------------------------------------------
           💬 3. 對話框與名字
           ------------------------------------------ */
        .dialog-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            z-index: 999;
            pointer-events: none;
        }

        .dialog-wrapper * {
            pointer-events: auto;
        }

        #對話框 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background: linear-gradient(
                to bottom, 
                rgba(0, 0, 0, 0.95) 0%,
                rgba(15, 15, 15, 0.85) 100%
            );
            clip-path: polygon(0% 0%, 100% 15%, 100% 100%, 0% 100%);
            z-index: 999;
        }

        #page1.hide-dialog #對話框,
        #page1.hide-dialog .player-svg {
            display: none !important;
        }

        #對話框那條線 {
            position: absolute;
            top: 240px;
            left: 0;
            width: 100%;
            height: 20px;
            background-color: #ffb30f;
            z-index: 20;
        }

        .player-svg {
            position: absolute;
            top: 606px !important;
            left: 20px;
            width: 300px;
            height: 70px;
            z-index: 1000;
        }

        .player-text {
            font-size: 50px;
            font-family: 'Dela Gothic One', Arial, sans-serif;
            display: none;
            stroke: #0f0f0f;   
            stroke-width: 20px;
            paint-order: stroke fill;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .name-star { fill: #ffab0f; }
        .name-curious { fill: #88fdf8; }
        .name-curious-random-person { fill: #88fdf8; }
        .name-curious-group { fill: #88fdf8; }
        .name-refreshing { fill: #ff8b8b; }
        .name-sympathy { fill: #f2aeff; }
        .name-passionate { fill: #c3ff9b; }

        #page1.speaker-star .name-star { display: block !important; }
        #page1.speaker-curious .name-curious { display: block !important; }
        #page1.speaker-curious-random-person .name-curious-random-person { display: block !important; }
        #page1.speaker-curious-group .name-curious-group { display: block !important; }
        #page1.speaker-refreshing .name-refreshing { display: block !important; }
        #page1.speaker-sympathy .name-sympathy { display: block !important; }
        #page1.speaker-passion .name-passionate { display: block !important; }

        #對話文本 {
            position: absolute;
            top: 35%;
            left: 8%;
            width: 90%;
            height: 75%;
            display: block;
            text-align: left;
            color: #ffffff;
            font-size: 24px;
            line-height: 1.4;
            font-weight: bold;
            margin: 0;
            padding: 0;
            word-break: break-word;
            overflow-y: auto;
            z-index: 10;
        }

        /* ------------------------------------------
           🔘 4. 選項框與按鈕
           ------------------------------------------ */
        #選項框 {
            width: 100%;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* 修正 1：字型檔路徑修正為相對路徑，去除檔名中的空格 */
        @font-face {
          font-family: 'CP-&-TRANS';
          src: url('./font/cp_and_trans.otf') format('truetype');
          font-weight: normal;
          font-style: normal;
          font-display: block;
        }

        .選項按鈕 {
            width: 90%;
            height: 55px;
            background-color: #232323;
            /* 修正 2：背景圖片路徑與檔名（轉小寫、改相對路徑） */
            background-image: url('./pct/option_box_single.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            color: white;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative; 
            z-index: 1000;
            font-family: 'CP-&-TRANS', sans-serif !important;
        }
        .選項按鈕.small-text {
            font-size: 14px;
        }

        .選項按鈕:active {
            transform: scale(0.98);
        }

        /* ------------------------------------------
           🛠️ 5. 選單與問名字彈窗
           ------------------------------------------ */
        .menu-container {
            position: absolute !important;
            top: 20px !important;
            left: 20px !important;
            right: auto !important;
            width: auto !important;
            max-width: none !important;
            margin: 0 !important;
            transform: none !important;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            z-index: 200000;
        }

        #burger-menu {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;      
            justify-content: center;  
            background-color: rgba(0, 0, 0, 0.6); 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #burger-menu img { 
            width: 26px; 
            height: auto; 
            pointer-events: none; 
        }

        #menu-items-wrapper {
            display: flex;
            gap: 8px;
            overflow: hidden;
            max-width: 0; 
            opacity: 0;
            transition: max-width 0.3s ease-in-out, opacity 0.2s ease;
            white-space: nowrap;
            align-items: center;
        }

        #menu-items-wrapper.open { 
            max-width: 200px;
            opacity: 1;
        }

        .nav-item {
            background-color: rgba(0, 0, 0, 0.7); 
            color: white;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.2s ease;
            border: 1.5px solid #444;
        }

        #menu-items-wrapper.open .nav-item { 
            opacity: 1; 
            transform: translateX(0); 
        }

        .nav-item img { 
            width: 20px; 
            height: auto; 
            pointer-events: none; 
        }

        .nav-item.active { 
            background-color: #ffa033; 
            border-color: #ffa033; 
        }

        #問名字 {
            display: none;
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999998;
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #問名字.show-bg {
            display: block !important;
            opacity: 1;
        }

        #askname-item {
            display: none;
            position: absolute;
            top: 45%; 
            left: 50%;
            z-index: 999999;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            background: #222222;
            border: 3px solid #ffb921;
            border-radius: 16px;
            text-align: center;
            opacity: 0;
        }

        @keyframes softPopIn {
            0% {
                opacity: 0;
                transform: translate(-50%, calc(-50% + 12px)) scale(0.92) translateZ(0);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) translateZ(0);
            }
        }

        #askname-item.show {
            display: block !important;
            animation: softPopIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            will-change: transform, opacity;
        }

        .ask-title { color: #ffffff; font-size: 18px; font-weight: bold; margin: 0 0 15px 0; }
        .ask-row { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .ask-input { height: 42px; flex: 1; min-width: 0; padding: 0 10px; font-size: 16px; font-weight: bold; text-align: center; border-radius: 8px; border: 1px solid #666; background: #fff; color: #000; }
        .ask-btn { height: 42px; padding: 0 16px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #ffd561; color: #222; border: none; border-radius: 8px; }

        #comic-box {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          z-index: 100;
          pointer-events: none;
        }

        @keyframes fadeInUp {
          0% {
            opacity: 0;
            transform: translateY(40px);
          }
          100% {
            opacity: 1;
            transform: translateY(0);
          }
        }

        #comic-img.anim-fade-in-up {
          animation: fadeInUp 0.6s ease-out forwards;
        }

        .comic-style-letter #comic-img {
          width: 290px;
          filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5));
          margin-top: -50px; 
        }

        .anim-fade-in-up {
          animation: fadeInUp 0.6s ease-out forwards;
        }
    </style>
</head>

<body>
    
    <div class="main-container">
        <div id="game-container">
            <div class="menu-container">
                <div id="burger-menu" onclick="event.stopPropagation(); toggleMenu(event);">
                    <!-- 修正 3：選單圖示改為相對路徑與英文檔名 -->
                    <img src="./pct/icon_menu.png" alt="選單">
                </div>
                <div id="menu-items-wrapper">
                    <div class="nav-item" onclick="event.stopPropagation(); skipToOption();">
                        <img src="./pct/icon_skip.png" alt="跳過">
                    </div>
                    <div class="nav-item" id="volume-btn" onclick="event.stopPropagation(); toggleBGM(this);">
                        <img src="./pct/icon_volume.png" alt="音量">
                    </div>
                </div>
            </div>

            <!-- 載入畫面 -->
            <div id="loading-screen">
                <div>正在連結...</div>
                <div class="progress-container">
                    <!-- 修正 4：GIF 載入圖檔名修改 -->
                    <img src="./pct/loading_jump.gif" alt="Loading..." style="width: 120px; height: 120px; left: -50px; margin-bottom: 5px;">
                    <div id="progress-bar"></div>
                </div>
                <div id="loading-percent">0%</div>
            </div>

            <!-- 主舞台 -->
            <div id="page1">
                <!-- 角色立繪：已更新路徑與英文檔名 -->
                <div id="星辰" class="全星辰 角色圖"><img src="./pct/singchen_normal.png" alt="星辰"></div>
                <div id="星辰害怕" class="全星辰 角色圖"><img src="./pct/singchen_scared.png" alt="星辰害怕"></div>
                <div id="星辰點頭" class="全星辰 角色圖"><img src="./pct/singchen_normal.png" alt="星辰點頭"></div>
                <div id="星辰嚇死" class="全星辰 角色圖"><img src="./pct/singchen_shocked.png" alt="星辰嚇死"></div>
                <div id="星辰驕傲" class="全星辰 角色圖"><img src="./pct/singchen_proud.png" alt="星辰驕傲"></div>
                <div id="星辰微笑" class="全星辰 角色圖"><img src="./pct/singchen_smile.png" alt="星辰微笑"></div>
                <div id="星辰思考" class="全星辰 角色圖"><img src="./pct/singchen_think.png" alt="星辰思考"></div>
                <div id="星辰苦惱" class="全星辰 角色圖"><img src="./pct/singchen_distressed.png" alt="星辰苦惱"></div>
                <div id="星辰感動" class="全星辰 角色圖"><img src="./pct/singchen_moved.png" alt="星辰感動"></div>
                
                <!-- 背景圖：修正為相對路徑 ./ 與純英文檔名 -->
                <div id="好奇星草原" class="背景圖"><img src="./pct/bg_curious_grass.png"></div>
                <div id="好奇星草叢" class="背景圖"><img src="./pct/bg_curious_bush.png"></div>
                <div id="好奇星棉花重災區" class="背景圖"><img src="./pct/bg_curious_cotton.png"></div>
                <div id="好奇星黃色結局" class="背景"><img src="./pct/bg_curious_ending.png"></div>
                <div id="火箭" class="背景圖"><img src="./pct/bg_curious_space.png"></div>

                <!-- 好奇星系列：檔名純英文化 -->
                <div id="好奇星" class="角色圖 全好奇星"><img src="./pct/curious_star_p.png" alt="好奇星"></div>
                <div id="好奇星開心" class="角色圖 全好奇星"><img src="./pct/curious_star_happy.png" alt="好奇星開心"></div>    
                <div id="好奇星會跳" class="角色圖 全好奇星"><img src="./pct/curious_star_p.png" alt="好奇星會跳"></div>
                <div id="好奇星有尾巴" class="角色圖 全好奇星"><img src="./pct/curious_star_tail.png" alt="好奇星有尾巴"></div>
                <div id="好奇星開心有尾巴" class="角色圖 全好奇星"><img src="./pct/curious_star_wink.png" alt="好奇星開心有尾巴"></div>

        let loadedCount = 0;

        function showScene(sceneNumber, isShake = false) {
            const bg = document.getElementById('page1');
            if (!bg) return;

            if (isShake) {
                bg.classList.remove('is-shaking');
                void bg.offsetWidth;

        function preloadImages(array, callback) {
            if (!array || array.length === 0) return callback();
            array.forEach(src => {
                const img = new Image();
                img.src = src;
                img.onload = () => handleAssetLoaded(callback);
                img.onerror = () => handleAssetLoaded(callback);
            });
        }

        function handleAssetLoaded(callback) {
            loadedCount++;
            let percent = Math.floor((loadedCount / totalCritical) * 100);
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('loading-percent');
            if (bar) bar.style.width = percent + "%";
            if (text) text.innerText = percent + "%";
            if (loadedCount >= totalCritical && typeof callback === "function") {
                callback();
            }
        }

        const minLoadingTime = 1000; 
        const startTime = Date.now();

        function enterGameAnimation() {
            const elapsedTime = Date.now() - startTime;
            const remainingTime = Math.max(0, minLoadingTime - elapsedTime);

            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.8s ease';
                    setTimeout(() => { 
                        loadingScreen.style.display = 'none'; 
                    }, 800);
                }
            }, remainingTime);
        }

        function startTypingEffect(text, callback) {
            const textTag = document.getElementById("對話文本");
            if (!textTag) return;

            if (window.myTypingTimer) {
                clearInterval(window.myTypingTimer);
                window.myTypingTimer = null;
            }

            let formattedText = (text || "")
                .replace(/\{playerName\}/g, window.playerName || "")
                .replace(/\(玩家名稱\)/g, window.playerName || "")
                .replace(/（玩家名稱）/g, window.playerName || "");

            window.currentFullText = formattedText;
            window.isTyping = true;
            textTag.innerHTML = ""; 

            let index = 0;
            window.myTypingTimer = setInterval(() => {
                if (!window.isTyping) {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                    return;
                }

                if (index < formattedText.length) {
                    textTag.innerHTML += formattedText.charAt(index);
                    index++;
                } else {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                    window.isTyping = false;
                    if (typeof callback === "function") callback();
                }
            }, 30);
        }

        function renderScene(stepIndex) {
            const scene = storyScript[stepIndex];
            if (!scene) return;

            const currentSceneId = scene.id !== undefined ? Number(scene.id) : null;
            const hasText = scene.text && scene.text.trim() !== "";
            const pageEl = document.getElementById('page1');

            document.querySelectorAll('.背景圖, .背景').forEach(el => {
                el.style.display = 'none';
                el.classList.remove('is-shaking', 'bg-impact-shake');
            });
            
            const currentBgId = scene.background || '好奇星草原';
            const bgContainer = document.getElementById(currentBgId);

            if (bgContainer) {
                bgContainer.style.display = 'block';
                void bgContainer.offsetWidth;

                const sceneText = typeof scene.text === 'string' ? scene.text : '';
                const isImpact = currentSceneId === 78;
                const isNormalShake = sceneText.includes("(背景搖晃)") || 
                                     [0, 76, 76.1, 77].includes(currentSceneId);

                if (isImpact) {
                    bgContainer.classList.add('bg-impact-shake');
                } else if (isNormalShake) {
                    bgContainer.classList.add('is-shaking');
                }
            }

            if (pageEl) {
                pageEl.className = ""; 
            }

            if (window.myTypingTimer) {
                clearInterval(window.myTypingTimer);
                window.myTypingTimer = null;
            }
            window.isTyping = false;

            if (scene.background) {
                document.querySelectorAll('.背景圖, .背景').forEach(el => el.style.display = 'none');
                const targetBg = document.getElementById(scene.background);
                if (targetBg) targetBg.style.display = 'block';
            }

            let displayName = "";
            if (hasText) {
                if (scene.speaker) {
                    displayName = (scene.speaker === "玩家") ? 
                        (window.playerName ? `${window.playerName}．星辰` : "星辰") : scene.speaker;
                } else if (scene.characters && scene.characters.length > 0) {
                    let charName = scene.characters[0];
                    if (charName.includes("路人") || charName.includes("好奇星張嘴") || charName.includes("好奇星閉嘴")) {
                        displayName = "路人好奇星";
                    } else if (charName.includes("一群好奇星")) {
                        displayName = "好奇星們";
                    } else if (charName.includes("星辰")) {
                        displayName = (currentSceneId < 8) ? "星辰" : (window.playerName ? `${window.playerName}．星辰` : "星辰");
                    } else if (charName.includes("好奇星")) {
                        displayName = "好奇星";
                    } else if (charName.includes("同情星")) {
                        displayName = "同情星";
                    } else if (charName.includes("熱情星")) {
                        displayName = "熱情星";
                    } else if (charName.includes("爽快星")) {
                        displayName = "爽快星";
                    } else {
                        displayName = charName;
                    }
                }
                
                if (pageEl) {
                    if (displayName.includes("路人好奇星")) pageEl.classList.add('speaker-curious-random-person');
                    else if (displayName.includes("好奇星們")) pageEl.classList.add('speaker-curious-group');
                    else if (displayName.includes("星辰") || scene.speaker === "玩家") pageEl.classList.add('speaker-star');
                    else if (displayName.includes("好奇星")) pageEl.classList.add('speaker-curious');
                    else if (displayName.includes("同情星")) pageEl.classList.add('speaker-sympathy');
                    else if (displayName.includes("熱情星")) pageEl.classList.add('speaker-passion');
                    else if (displayName.includes("爽快星")) pageEl.classList.add('speaker-refreshing');
                    else pageEl.classList.add('speaker-star');
                }
            }

            if (currentSceneId === 8) showInputBox();
            else hideInputBox();

            const optBox = document.getElementById('選項框');
            if (optBox) optBox.style.display = 'none';

            if (scene.bgm) {
                playBGM(scene.bgm);
            } else if (scene.bgm === null) {
                fadeOutBGM();
            }
            
            hideAllCharacters();
            if (scene.characters && Array.isArray(scene.characters)) {
                scene.characters.forEach(charName => {
                    const charEl = document.getElementById(charName);
                    if (charEl) {
                        charEl.style.display = 'block';
                        updateCharacterAnimation(charName);
                    }
                });
            }

            if (scene.characters && Array.isArray(scene.characters)) {
                scene.characters.forEach(charName => {
                    if (charName === "星辰害怕") playScaredAnim("星辰害怕");
                    else if (charName === "星辰嚇死") playScaredAnim("星辰嚇死");
                    else if (charName === "星辰") playCuriousAnim("星辰", "curious-bounce");
                    else if (charName === "星辰驕傲") playNodAnim("星辰驕傲");
                    else if (charName === "星辰點頭") playNodAnim("星辰點頭");
                    else if (charName === "一群好奇星") playHappyJumpAnim("一群好奇星");
                    else if (charName === "好奇星") playCuriousAnim("好奇星", "curious-bounce");
                    else if (charName === "好奇星開心") playCuriousAnim("好奇星開心", "curious-wiggle");
                    else if (charName === "好奇星會跳") playCuriousAnim("好奇星會跳", "curious-pop");
                    else if (charName === "好奇星有尾巴") playCuriousAnim("好奇星有尾巴", "curious-bounce");
                    else if (charName === "好奇星開心有尾巴") playCuriousAnim("好奇星開心有尾巴", "curious-wiggle");
                });
            }

            const comicBox = document.getElementById('comic-box');
            const comicImg = document.getElementById('comic-img');

            if (scene.comicImages && Array.isArray(scene.comicImages) && scene.comicImages.length > 0) {
                if (comicBox && comicImg) {
                    const newImgPath = scene.comicImages[0];
                    const currentImgPath = comicImg.getAttribute('src');

                    if (currentImgPath !== newImgPath || comicBox.style.display === 'none') {
                        comicImg.classList.remove('anim-fade-in-up');
                        void comicImg.offsetWidth; 

                        comicImg.src = newImgPath;
                        comicBox.style.display = 'block';

                        const fileName = newImgPath.split('/').pop().replace(/\.[^/.]+$/, "");
                        comicBox.className = `comic-style-${fileName}`;
                        comicImg.classList.add('anim-fade-in-up');
                    }
                }
            } else {
                if (comicBox) {
                    comicBox.style.display = 'none';
                    comicBox.className = '';
                }
                if (comicImg) {
                    comicImg.className = '';
                    comicImg.removeAttribute('src');
                }
            }

            startTypingEffect(scene.text, () => {
                renderOptions(scene);
            });
        }
        
        function updateCharacterAnimation(characterId) {
            const charElement = document.getElementById(characterId);
            if (!charElement) return;

            charElement.classList.remove('anim-bounce', 'anim-sway', 'anim-depress', 'anim-cry', 'anim-nod', 'anim-excited');

                    charElement.classList.add('anim-bounce');

                    charElement.classList.add('anim-sway');
                    break;

                case '星辰苦惱':

                    charElement.classList.add('anim-depress');
                    break;

                case '好奇星哭':

                    charElement.classList.add('anim-cry');

            const optBox = document.getElementById('選項框');
            if (!optBox) return;

            if (scene && scene.options && scene.options.length > 0) {
                optBox.innerHTML = '';
                scene.options.forEach(opt => {
                    const btn = document.createElement('div');
                    btn.className = '選項按鈕';
                    if (opt.text.length > 12) btn.classList.add('small-text');
                    btn.innerText = opt.text;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        selectOption(opt, scene);
                    };
                    optBox.appendChild(btn);
                });
                optBox.style.display = 'flex';
            } else {
                optBox.style.display = 'none';
            }
        }

        function selectOption(option, currentScene) {
            if (option.score && !scoredSceneIds.has(currentScene.id)) {
                for (let character in option.score) {
                    scores[character] = (scores[character] || 0) + option.score[character];
                }
                scoredSceneIds.add(currentScene.id);
            }

            const nextIndex = storyScript.findIndex(s => s.id === option.nextId);
            if (nextIndex !== -1) {
                currentStep = nextIndex;
                renderScene(currentStep);
            }
        }
        
        function nextStep() {
            const scene = storyScript[currentStep];
            if (scene && Number(scene.id) === 8) return;

            if (window.isTyping) {
                if (window.myTypingTimer) {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                }
                window.isTyping = false;
                const textBox = document.getElementById("對話文本");
                if (textBox) textBox.innerHTML = window.currentFullText;
                renderOptions(scene);
                return;
            }

            if (scene && scene.options && scene.options.length > 0) return;

            if (scene && scene.nextId !== undefined) {
                currentStep = storyScript.findIndex(s => s.id === scene.nextId);
            } else {
                currentStep++;
            }

            if (currentStep < storyScript.length && currentStep !== -1) {
                renderScene(currentStep);
            }
        }

        function playBGM(audioSrc, targetVolume = 0.5, fadeInDuration = 1500) {
            const bgmPlayer = document.getElementById('bgm-player');
            if (!bgmPlayer) return;

            if (window.bgmFadeTimer) clearInterval(window.bgmFadeTimer);

            if (bgmPlayer.getAttribute('src') === audioSrc && !bgmPlayer.paused) {
                bgmPlayer.volume = targetVolume;
                return;
            }

            bgmPlayer.src = audioSrc;
            bgmPlayer.volume = 0;
            
            const playPromise = bgmPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    const interval = 50;
                    const step = targetVolume / (fadeInDuration / interval);

                    window.bgmFadeTimer = setInterval(() => {
                        if (bgmPlayer.volume + step < targetVolume) {
                            bgmPlayer.volume += step;
                        } else {
                            bgmPlayer.volume = targetVolume;
                            clearInterval(window.bgmFadeTimer);
                            window.bgmFadeTimer = null;
                        }
                    }, interval);
                }).catch(err => {
                    console.log("等待玩家點擊互動後播放音訊");
                });
            }
        }

        function fadeOutBGM(fadeOutDuration = 1500) {
            const bgmPlayer = document.getElementById('bgm-player');
            if (!bgmPlayer || bgmPlayer.paused) return;

            if (window.bgmFadeTimer) clearInterval(window.bgmFadeTimer);

            const startVolume = bgmPlayer.volume;
            const interval = 50;
            const step = startVolume / (fadeOutDuration / interval);

            window.bgmFadeTimer = setInterval(() => {
                if (bgmPlayer.volume - step > 0) {
                    bgmPlayer.volume -= step;
                } else {
                    bgmPlayer.pause();
                    bgmPlayer.currentTime = 0;
                    bgmPlayer.volume = startVolume;
                    clearInterval(window.bgmFadeTimer);
                    window.bgmFadeTimer = null;
                }
            }, interval);
        }

        window.isMuted = false;

        function toggleBGM(btnEl) {
            const bgmPlayer = document.getElementById('bgm-player');
            
            window.isMuted = !window.isMuted;

            if (bgmPlayer) {
                bgmPlayer.muted = window.isMuted;
            }

            if (btnEl) {
                if (window.isMuted) {
                    btnEl.classList.add('active');
                } else {
                    btnEl.classList.remove('active');
                }
            }
        }
    </script>
</body>
</html>
